name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Full suite in the deployed native-document environment
        run: |
          docker run --rm -v "$PWD:/source:ro" \
            -e PYTHON_TEST_VERSION=${{ matrix.python-version }} \
            ghcr.io/astral-sh/uv:python3.12-alpine@sha256:2501529eb49d9f3ad85ed6ea53fb775f84034587f2ea807dd42b01413a383c1e \
            sh -ec 'apk add --no-cache bash git curl nodejs npm poppler-utils libreoffice font-dejavu font-noto-cjk; mkdir /tmp/runtime; tar -C /source --exclude=.git --exclude=.venv --exclude=.ruff_cache --exclude=.pytest_cache -cf - . | tar -C /tmp/runtime -xf -; cd /tmp/runtime; uv run --locked --python "$PYTHON_TEST_VERSION" --extra dev python -m pytest -q -m "not e2e"' 
      - run: uv build
