# Tool adapter registry
#
# Each entry declares one integration tool.  Add a new tool here (plus its
# SKILL.md in analyst_runtime/skills/) without touching registry.py or loop.py.
#
# Schema per entry:
#   id:       unique slug (used in logs)
#   class:    Python class name inside the module
#   module:   dotted module path
#   args:     constructor keyword arguments
#     <param>:
#       env: ENV_VAR_NAME       → resolved from os.environ at startup
#       workspace: true          → receives the sandbox workspace Path
#       static: <value>          → hardcoded value

adapters:
  - id: gateway_auth
    class: GatewayAuthTool
    module: analyst_runtime.agent.tools.gateway_auth

  - id: notion
    class: NotionTool
    module: analyst_runtime.agent.tools.notion
    args:
      api_key: {env: NOTION_API_KEY}

  - id: youtube
    class: YouTubeTool
    module: analyst_runtime.agent.tools.youtube
    args:
      api_key: {env: YOUTUBE_API_KEY}

  - id: google_maps
    class: GoogleMapsTool
    module: analyst_runtime.agent.tools.google_maps
    args:
      api_key: {env: GOOGLE_MAPS_API_KEY}

  - id: slack
    class: SlackTool
    module: analyst_runtime.agent.tools.slack_tool
    args:
      bot_token: {env: SLACK_BOT_TOKEN}

  - id: teams
    class: TeamsTool
    module: analyst_runtime.agent.tools.teams
    args:
      access_token: {env: TEAMS_ACCESS_TOKEN}

  - id: composio_search
    class: ComposioSearchToolsTool
    module: analyst_runtime.agent.tools.composio
    args:
      workspace: {workspace: true}

  - id: composio_manage
    class: ComposioManageConnectionsTool
    module: analyst_runtime.agent.tools.composio
    args:
      workspace: {workspace: true}

  - id: composio_execute
    class: ComposioExecuteToolsTool
    module: analyst_runtime.agent.tools.composio
    args:
      workspace: {workspace: true}
