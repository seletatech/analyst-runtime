x-common-config: &common-config
  build:
    context: ..
    dockerfile: analyst-runtime/Dockerfile
  volumes:
    - ~/.analyst-runtime:/root/.analyst-runtime

services:
  analyst-runtime-gateway:
    container_name: analyst-runtime-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
  
  analyst-runtime-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
